{% extends "base.html" %}
{% load static %}

{% block content %}
<h2>Edit Equipment</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">Save Changes</button>
</form>


<!-- Delete button in a separate form -->
<form method="post" action="{% url 'equipment_delete' gear.id %}" onsubmit="return confirmDelete()">
    {% csrf_token %}
    <button type="submit" style="background-color: red; color: white;">Delete Equipment</button>
</form>

<script>
    function confirmDelete() {
        return confirm("Are you sure you want to delete this gear?");
    }
</script>

<a href="{% url 'gear_list' %}">⬅ Back to gear list</a>


<a href="{% url 'gear_list' %}">⬅ Back to gear list</a>
{% endblock %}
